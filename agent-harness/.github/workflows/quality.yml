name: Quality Gate
on:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Quality Gate
        run: bash scripts/harness-quality.sh
